name: watch-apk

on:
  push:
    paths: ["watch/**", ".github/workflows/watch.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/key.p12" >> "$GITHUB_ENV"
          fi
      - name: APK 빌드
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle -p watch assembleDebug --no-daemon
      - run: cp watch/app/build/outputs/apk/debug/app-debug.apk school-alarm-watch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: school-alarm-watch
          path: school-alarm-watch.apk
      - name: 최신 APK를 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view watch-latest >/dev/null 2>&1 || gh release create watch-latest --title "워치 앱 최신" --notes "갤럭시 워치용 등교 알리미 APK"
          gh release upload watch-latest school-alarm-watch.apk --clobber
