<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>등교 알리미</title>
<meta name="theme-color" content="#121315">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 한 화면 앱: 위에 "출발까지 남은 시간" 하나, 아래 오늘 수업 → 이번 주. 폰 다크 모드 시간표 앱 옆에 놓일 단일 다크 테마 */
:root {
  color-scheme: dark;
  --bg: #121315;
  --panel: #1b1c20;
  --line: #2c2e34;
  --fg: #eceef2;
  --muted: #8d919c;
  --go: #ffb44a;
  --late: #ff6b5e;
  --done: #6fcf97;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
html, body { height: 100%; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 480px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 22px; }
.top { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 13px; }
.top b { color: var(--fg); font-size: 17px; font-weight: 700; }

.hero { display: flex; flex-direction: column; gap: 6px; padding-block: 8px 4px; }
.hero .label { font-size: 14px; color: var(--muted); letter-spacing: .02em; }
.hero .count { font-family: var(--f-num); font-weight: 700; font-size: clamp(52px, 17vw, 76px); line-height: 1; letter-spacing: -.03em; color: var(--go); font-variant-numeric: tabular-nums; }
.hero.late .count { color: var(--late); }
.hero.ok .count, .hero.free .count { color: var(--done); }
.hero .sub { font-size: 15px; }
.hero .sub span { font-family: var(--f-num); }

.go-btn {
  align-self: flex-start; margin-top: 10px; font: inherit; font-weight: 700; font-size: 15px;
  padding: 12px 20px; border-radius: 12px; border: 0; cursor: pointer;
  background: var(--go); color: #1a1205;
}
.go-btn[aria-pressed="true"] { background: transparent; color: var(--done); box-shadow: inset 0 0 0 2px var(--done); }
.go-btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .06em; }
.list { display: flex; flex-direction: column; gap: 8px; }
.cls { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center; background: var(--panel); border-radius: 12px; padding: 12px 14px 12px 0; overflow: hidden; }
.cls .bar { align-self: stretch; }
.cls .name { font-weight: 600; min-width: 0; }
.cls .room { font-size: 13px; color: var(--muted); }
.cls .time { font-family: var(--f-num); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.cls.past { opacity: .4; }
.cls .now { display: inline-block; font-size: 11px; font-weight: 700; color: #121315; background: var(--done); border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
.empty { color: var(--muted); background: var(--panel); border-radius: 12px; padding: 16px 14px; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.chip { font: inherit; background: var(--panel); border: 0; border-radius: 10px; color: var(--fg); padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.chip small { font-family: var(--f-num); font-size: 12px; color: var(--muted); }
.chip[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--fg); }
.chip.off small { color: var(--line); }

.note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
@media (prefers-reduced-motion: no-preference) { .hero.late .count { animation: blink 1s steps(2) infinite; } }
@keyframes blink { 50% { opacity: .55; } }

.weight-sec { display: flex; flex-direction: column; gap: 12px; }
.weight-sec h2 { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.w-form { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.w-form button { grid-column: 1 / -1; padding: 10px 0 !important; }
.w-form input { font-size: 16px !important; }
.w-form input { flex: 1; min-width: 0; font: inherit; font-family: var(--f-num); font-size: 18px; color: var(--fg); background: var(--panel); border: 0; border-radius: 10px; padding: 10px 12px; }
.w-form button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 0 18px; background: var(--done); color: #0f1a13; cursor: pointer; }
.w-form input:focus-visible, .w-form button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.w-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.w-stats div { background: var(--panel); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
.w-stats small { font-size: 12px; color: var(--muted); }
.w-stats b { font-family: var(--f-num); font-size: 17px; font-variant-numeric: tabular-nums; }
.w-stats .good { color: var(--done); } .w-stats .bad { color: var(--late); }
.w-chart { width: 100%; height: auto; background: var(--panel); border-radius: 12px; }
.w-chart text { fill: var(--muted); font-family: var(--f-num); font-size: 10px; }
.ics { display: flex; flex-direction: column; gap: 10px; }
.ics a { align-self: flex-start; font-weight: 700; color: var(--fg); text-decoration: none; padding: 10px 16px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px var(--line); }
.ics a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* 워치(갤럭시 워치 브라우저 등 좁은 둥근 화면): 큰 숫자 하나만 가운데 */
@media (max-width: 320px) {
  body { padding-left: 14%; padding-right: 14%; font-size: 13px; }
  .wrap { box-sizing: border-box; min-height: 100%; justify-content: center; padding-block: 12px; gap: 6px; }
  .top, .list-sec, .week-sec, .weight-sec, .ics, .go-btn { display: none !important; }
  .hero { align-items: center; text-align: center; padding: 0; gap: 2px; }
  .hero .label { font-size: 12px; }
  .hero .count { font-size: 36px; }
  .hero .sub { font-size: 12px; line-height: 1.35; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top"><b id="today">10월 19일 월요일</b><span>2026-2학기</span></div>

  <section class="hero" id="hero" aria-live="polite">
    <div class="label" id="heroLabel">등교 출발까지</div>
    <div class="count" id="heroCount">--:--</div>
    <div class="sub" id="heroSub"></div>
    <button class="go-btn" id="goBtn" type="button" aria-pressed="false">출발했어요</button>
  </section>

  <section class="list-sec">
    <h2 id="listTitle">오늘 일정</h2>
    <div class="list" id="list"></div>
  </section>

  <section class="week-sec">
    <h2>이번 주 · 요일 누르면 그날 일정</h2>
    <div class="week" id="week"></div>
  </section>

  <section class="weight-sec">
    <h2>체중 · 체성분 · 목표 12월 26일</h2>
    <form class="w-form" id="wForm">
      <label for="wInput" class="sr">체중 (kg)</label>
      <input id="wInput" type="number" inputmode="decimal" step="0.1" min="30" max="200" placeholder="체중 kg" required>
      <label for="fInput" class="sr">체지방률 (%)</label>
      <input id="fInput" type="number" inputmode="decimal" step="0.1" min="3" max="60" placeholder="체지방 %">
      <label for="mInput" class="sr">골격근량 (kg)</label>
      <input id="mInput" type="number" inputmode="decimal" step="0.1" min="10" max="80" placeholder="골격근 kg">
      <button type="submit" id="wSave">오늘 기록</button>
    </form>
    <div class="w-stats" id="wStats"></div>
    <svg id="wChart" class="w-chart" viewBox="0 0 320 140" role="img" aria-label="체중 변화 그래프"></svg>
    <svg id="fChart" class="w-chart" viewBox="0 0 320 140" role="img" aria-label="체지방률 변화 그래프"></svg>
    <p class="note" id="wNote"></p>
  </section>

  <section class="ics">
    <h2>알림 넣기</h2>
    <a href="timetable.ics" download="timetable.ics">캘린더 알림 파일 받기</a>
    <p class="note">받은 파일을 열고 <b>삼성 캘린더</b>로 저장하면 폰과 워치에서 알림이 울려요. 학교 가는 날은 헬스 1시간 30분 전에 출발 알림, 수업은 10분 전, 과제·그림·독서·게임·식사·체중은 시작할 때, 자정엔 게임 끝 알림. 이 화면은 남은 시간 확인용이에요.</p>
  </section>
</div>

<script>
const LEAD = 90; // 학교 첫 일정 몇 분 전에 출발
const C = { meal: "#e0b85f", scale: "#6fcf97", gym: "#e06c9f", walk: "#e06c9f", hw: "#8a8fe0", draw: "#c88ae0", read: "#7fb8e6", game: "#5f6370", bed: "#5f6370" };
// school: 학교에서 하는 일정(출발 시각 계산에 씀)
const ITEMS = [
  { d: [1, 2, 3], name: "헬스", room: "학교 헬스장 · 끝나고 씻기", s: "10:30", e: "11:30", c: C.gym, school: true },
  { d: [5],       name: "헬스", room: "학교 헬스장 · 끝나고 씻기", s: "11:30", e: "12:30", c: C.gym, school: true },
  { d: [4], name: "자전거 15km", room: "평지 · 약 50분", s: "10:00", e: "10:50", c: C.walk },
  { d: [3], name: "자전거 15km", room: "평지 · 약 50분", s: "16:00", e: "16:50", c: C.walk },
  { d: [5], name: "자전거 15km", room: "평지 · 약 50분", s: "17:30", e: "18:20", c: C.walk },
  { d: [6], name: "자전거 15km", room: "평지 · 약 50분", s: "10:30", e: "11:20", c: C.walk },
  { d: [0], name: "자전거 15km", room: "11/15부터는 달리기 5km (천천히)", s: "10:30", e: "11:20", c: C.walk },
  { d: [3], name: "과제 (밀린 것)", room: "", s: "14:00", e: "15:30", c: C.hw },
  { d: [4], name: "과제 집중", room: "마감 가까운 것부터", s: "14:00", e: "17:00", c: C.hw },
  { d: [0, 6], name: "아침", room: "단백질 먼저", s: "10:00", e: "10:20", c: C.meal },
  { d: [0, 6], name: "점심", room: "단백질 먼저", s: "13:00", e: "13:30", c: C.meal },
  { d: [0, 6], name: "저녁", room: "단백질 먼저", s: "18:30", e: "19:00", c: C.meal },
  { d: [6], name: "그림 연습", room: "", s: "15:00", e: "16:00", c: C.draw },
  { d: [0], name: "다음 주 마감·과제 정리", room: "", s: "21:00", e: "21:20", c: C.hw },
  { d: [0, 6], name: "야식 금지", room: "", s: "22:30", e: "22:35", c: C.game },
  { d: [1], name: "ICT시대의 디자인씽킹", room: "수리관 (A)-501", s: "12:00", e: "14:50", c: "#d0766a", school: true },
  { d: [1], name: "메타디자인",           room: "대신관 (C)-303", s: "15:00", e: "17:50", c: "#cfad5f", school: true },
  { d: [2], name: "비주얼내러티브",       room: "대신관 (C)-306", s: "12:00", e: "14:50", c: "#94ad64", school: true },
  { d: [2], name: "3D컴퓨터그래픽스II",   room: "대신관 (C)-302", s: "15:00", e: "17:50", c: "#6fb3a6", school: true },
  { d: [3], name: "자기계발과 Life DESIGN", room: "강의실 미정",  s: "12:00", e: "12:50", c: "#6b8fca", school: true },
  { d: [5], name: "인터페이스디자인",     room: "대신관 (C)-303", s: "13:00", e: "15:50", c: "#d9965a", school: true },
  { d: [1, 2, 3, 4, 5], name: "과제",      room: "", s: "19:30", e: "21:00", c: C.hw },
  { d: [1, 2, 3, 4, 5], name: "그림 연습", room: "", s: "21:00", e: "22:00", c: C.draw },
  { d: [1, 2, 3, 4, 5], name: "독서",      room: "", s: "22:00", e: "22:30", c: C.read },
  { d: [1, 2, 3, 4, 5], name: "게임",      room: "자정에 끝 · 야식 금지", s: "22:30", e: "24:00", c: C.game },
  { d: [1, 2, 3, 4, 5], name: "체중 재기", room: "화장실 다녀와서 · 아래에 기록", s: "07:40", e: "07:45", c: C.scale },
  { d: [0, 6],          name: "체중 재기", room: "화장실 다녀와서 · 아래에 기록", s: "09:30", e: "09:35", c: C.scale },
  { d: [1, 2, 3, 4, 5], name: "아침", room: "단백질 먼저", s: "08:00", e: "08:20", c: C.meal },
  { d: [1, 2, 3],       name: "점심", room: "헬스 끝 · 단백질 먼저", s: "11:35", e: "11:55", c: C.meal },
  { d: [4],             name: "점심", room: "단백질 먼저", s: "12:00", e: "12:30", c: C.meal },
  { d: [5],             name: "점심", room: "헬스 끝 · 단백질 먼저", s: "12:35", e: "12:55", c: C.meal },
  { d: [1, 2, 3, 4, 5], name: "저녁", room: "단백질 먼저", s: "19:00", e: "19:30", c: C.meal },
];
const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
const $ = id => document.getElementById(id);
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const forDay = d => ITEMS.filter(c => c.d.includes(d)).sort((a, b) => mins(a.s) - mins(b.s));
const departOf = d => { const f = forDay(d).find(c => c.school); return f ? { at: mins(f.s) - LEAD, first: f } : null; };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

let viewDay = null; // null = 오늘

function nextStart(from) {
  for (let i = 1; i <= 7; i++) { const d = (from + i) % 7; const f = forDay(d)[0]; if (f) return { d, ahead: i, f }; }
}

function setHero(cls, label, count, sub) {
  $("hero").className = "hero" + (cls ? " " + cls : "");
  $("heroLabel").textContent = label;
  $("heroCount").textContent = count;
  $("heroSub").innerHTML = sub;
}

function render() {
  const now = new Date();
  const today = now.getDay();
  const nowM = now.getHours() * 60 + now.getMinutes();
  const sec = now.getSeconds();
  const key = "left-" + now.toDateString();
  const left = store.get(key) === "1";
  $("today").textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${DAYS[today]}요일`;

  // 큰 숫자: 등교 전이면 출발 카운트다운, 그 뒤엔 지금/다음 할 일
  const todays = forDay(today), dep = departOf(today), btn = $("goBtn");
  const beforeSchool = dep && nowM < mins(dep.first.s);
  btn.hidden = !beforeSchool;
  if (beforeSchool) {
    btn.setAttribute("aria-pressed", left);
    btn.textContent = left ? "출발함 ✓ (취소)" : "출발했어요";
  }
  const cur = todays.find(c => nowM >= mins(c.s) && nowM < mins(c.e));
  const next = todays.find(c => nowM < mins(c.s));
  const nextTxt = c => `${c.name} <span>${c.s}</span>${c.room ? " · " + c.room : ""}`;

  if (beforeSchool && !left && nowM < dep.at) {
    setHero("", "등교 출발까지", countdown(dep.at - nowM, sec), `<span>${hhmm(dep.at)}</span> 출발 → ${dep.first.name} <span>${dep.first.s}</span>`);
  } else if (beforeSchool && !left) {
    setHero("late", "지금 나가야 해요 · " + dep.first.name + "까지", countdown(mins(dep.first.s) - nowM, sec), `출발 시각 <span>${hhmm(dep.at)}</span> 지남`);
  } else if (cur) {
    setHero("ok", `${cur.name} 끝나기까지`, countdown(mins(cur.e) - nowM, sec), next ? "다음: " + nextTxt(next) : "오늘 마지막 일정");
  } else if (next) {
    setHero("", `${next.name}까지`, countdown(mins(next.s) - nowM, sec), nextTxt(next));
  } else {
    const n = nextStart(today), nd = departOf(n.d);
    const when = n.ahead === 1 ? "내일" : DAYS[n.d] + "요일";
    setHero("free", "오늘 일정 끝", "잘 시간", nd
      ? `${when} <span>${hhmm(nd.at)}</span> 출발 · ${nd.first.name}`
      : `${when} <span>${n.f.s}</span> ${n.f.name}`);
  }

  // 일정 목록
  const d = viewDay ?? today;
  const isToday = d === today;
  $("listTitle").textContent = isToday ? "오늘 일정" : `${DAYS[d]}요일 일정`;
  const list = forDay(d), dd = departOf(d);
  const depRow = dd ? `<div class="cls depart${isToday && nowM >= dd.at ? " past" : ""}"><span class="bar" style="background:var(--go)"></span>
      <div><div class="name">등교 출발</div><div class="room">${dd.first.name} ${dd.first.s} 1시간 30분 전</div></div>
      <div class="time">${hhmm(dd.at)}</div></div>` : "";
  const at = dd ? list.findIndex(c => mins(c.s) >= dd.at) : -1;
  $("list").innerHTML = list.length ? list.map((c, i) => {
    const past = isToday && nowM >= mins(c.e);
    const live = isToday && nowM >= mins(c.s) && nowM < mins(c.e);
    return `<div class="cls${past ? " past" : ""}"><span class="bar" style="background:${c.c}"></span>
      <div><div class="name">${c.name}${live ? '<span class="now">지금</span>' : ""}</div>${c.room ? `<div class="room">${c.room}</div>` : ""}</div>
      <div class="time">${c.s}–${c.e === "24:00" ? "00:00" : c.e}</div></div>`;
  }).map((row, i) => (i === at ? depRow : "") + row).join("") : `<div class="empty">${DAYS[d]}요일은 일정이 없어요.</div>`;

  // 요일 칩: 그날 출발 시각
  $("week").innerHTML = [1, 2, 3, 4, 5, 6, 0].map(w => {
    const x = departOf(w);
    return `<button type="button" id="day-${w}" class="chip" data-d="${w}" aria-current="${w === d}">
      <span>${DAYS[w]}</span><small>${x ? hhmm(x.at) : w === 0 || w === 6 ? "주말" : "공강"}</small></button>`;
  }).join("");
}

function countdown(m, sec) {
  const total = m * 60 - sec;
  if (total <= 0) return "0:00";
  const h = Math.floor(total / 3600), mm = Math.floor(total % 3600 / 60), ss = total % 60;
  return h ? `${h}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}` : `${mm}:${String(ss).padStart(2, "0")}`;
}

$("week").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const d = Number(b.dataset.d);
  viewDay = d === new Date().getDay() ? null : d;
  render();
});
$("goBtn").addEventListener("click", () => {
  const key = "left-" + new Date().toDateString();
  store.set(key, store.get(key) === "1" ? null : "1");
  render();
});

// ── 체중·체성분 기록 (이 폰 브라우저에만 저장) ──
// 시작: 10/26 워치 측정. 목표: 근육 그대로 두고 지방만 빼서 체지방 18% ≈ 68kg
const START = { date: "2026-10-26", kg: 76.0, fat: 26.6, muscle: 29.8 };
const GOAL = { date: "2026-12-26", kg: 68, fat: 18 };
const dayMs = 864e5, toDate = s => new Date(s + "T00:00:00");
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function loadW() {
  let w = {};
  try { w = JSON.parse(store.get("weights") || "{}"); } catch {}
  for (const k in w) if (typeof w[k] === "number") w[k] = { kg: w[k] }; // 예전 형식
  return w;
}
function avg7(w, upto, key = "kg") {
  const xs = Object.entries(w).filter(([d, v]) => d <= upto && toDate(upto) - toDate(d) < 7 * dayMs && v[key] != null).map(([, v]) => v[key]);
  return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
}
const latest = (w, key) => { const d = Object.keys(w).sort().reverse().find(d => w[d][key] != null); return d ? w[d][key] : null; };
const sign = v => (v > 0 ? "+" : "") + v.toFixed(1);

function chart(el, w, key, lo, hi, ticks, startV, goalV, unit) {
  const X0 = 30, X1 = 312, Y0 = 10, Y1 = 120;
  const span = toDate(GOAL.date) - toDate(START.date);
  const x = d => X0 + (X1 - X0) * (toDate(d) - toDate(START.date)) / span;
  const y = v => Y0 + (Y1 - Y0) * (hi - Math.min(hi, Math.max(lo, v))) / (hi - lo);
  let g = "";
  for (const t of ticks) g += `<line x1="${X0}" x2="${X1}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="2" y="${y(t) + 3}">${t}${unit}</text>`;
  g += `<text x="${X0}" y="135">10/26</text><text x="${X1}" y="135" text-anchor="end">12/26</text>`;
  g += `<line x1="${x(START.date)}" y1="${y(startV)}" x2="${x(GOAL.date)}" y2="${y(goalV)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  const days = Object.keys(w).sort().filter(d => d >= START.date && d <= GOAL.date && w[d][key] != null);
  if (days.length) {
    g += days.map(d => `<circle cx="${x(d).toFixed(1)}" cy="${y(w[d][key]).toFixed(1)}" r="2.5" fill="var(--muted)"/>`).join("");
    g += `<polyline points="${days.map(d => `${x(d).toFixed(1)},${y(avg7(w, d, key)).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--done)" stroke-width="2.5" stroke-linejoin="round"/>`;
    const e = days[days.length - 1];
    g += `<circle cx="${x(e).toFixed(1)}" cy="${y(avg7(w, e, key)).toFixed(1)}" r="4" fill="var(--done)"/>`;
  }
  el.innerHTML = g;
}

function renderWeight() {
  const w = loadW(), today = ymd(new Date()), t0 = w[today] || {};
  for (const [id, k] of [["wInput", "kg"], ["fInput", "fat"], ["mInput", "muscle"]])
    if (t0[k] != null && document.activeElement !== $(id) && !$(id).value) $(id).value = t0[k];

  const kg = avg7(w, today) ?? latest(w, "kg") ?? START.kg;
  const fat = latest(w, "fat") ?? START.fat;
  const mus = latest(w, "muscle") ?? START.muscle;
  const dFat = fat - START.fat, dMus = mus - START.muscle;
  $("wStats").innerHTML = `<div><small>체중 7일 평균</small><b>${kg.toFixed(1)}kg</b><small>${sign(kg - START.kg)}</small></div>
    <div><small>체지방률</small><b class="${dFat <= 0 ? "good" : "bad"}">${fat.toFixed(1)}%</b><small>${sign(dFat)}%p</small></div>
    <div><small>골격근량</small><b class="${dMus >= -0.5 ? "good" : "bad"}">${mus.toFixed(1)}kg</b><small>${dMus >= -0.5 ? "유지 중" : "줄었어요"}</small></div>`;

  const left = Math.max(0, Math.ceil((toDate(GOAL.date) - toDate(today)) / dayMs));
  $("wNote").textContent = !Object.keys(w).length
    ? "아침에 화장실 다녀와서 워치로 체성분을 재고 세 숫자를 넣어 주세요. 체중만 넣어도 돼요. 이 폰 브라우저에만 저장돼요."
    : dMus < -0.5
      ? `근육이 ${(-dMus).toFixed(1)}kg 줄었어요. 단백질을 더 먹고 헬스 무게를 유지하세요. 목표까지 ${left}일.`
      : `목표 68kg · 체지방 18%까지 ${left}일. 하루 숫자는 물 때문에 흔들려요. 초록 선(7일 평균)을 보세요.`;

  chart($("wChart"), w, "kg", 66, 78, [76, 72, 68], START.kg, GOAL.kg, "");
  chart($("fChart"), w, "fat", 16, 28, [26, 22, 18], START.fat, GOAL.fat, "%");
}
$("wForm").addEventListener("submit", e => {
  e.preventDefault();
  const num = id => { const v = parseFloat($(id).value); return isFinite(v) ? Math.round(v * 10) / 10 : null; };
  const kg = num("wInput"); if (!(kg > 30 && kg < 200)) return;
  const entry = { kg };
  const fat = num("fInput"), muscle = num("mInput");
  if (fat != null) entry.fat = fat;
  if (muscle != null) entry.muscle = muscle;
  const w = loadW(); w[ymd(new Date())] = entry;
  store.set("weights", JSON.stringify(w));
  $("wSave").textContent = "저장됨";
  setTimeout(() => { $("wSave").textContent = "오늘 기록"; }, 1500);
  document.activeElement.blur();
  renderWeight();
});

render();
renderWeight();
setInterval(render, 1000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
